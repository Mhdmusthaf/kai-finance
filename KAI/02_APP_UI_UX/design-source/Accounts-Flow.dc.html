<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Accounts &amp; credit cards — flow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 48px; padding: 40px 48px 48px; background: #EEE9DF; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; width: max-content; align-items: flex-start">
  <sc-for list="{{items}}" as="s" hint-placeholder-count="11">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: Nunito, sans-serif; font-size: 20px">{{s.t}}</b><span style="font-size: 13px; color: #5F6E67; max-width: 390px; min-height: 36px">{{s.d}}</span></div>
      <div style="{{s.frame}}">
        <sc-if value="{{s.l}}" hint-placeholder-val="{{false}}"><dc-import name="Obj-List" kind="{{s.kind}}" state="{{s.state}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.dt}}" hint-placeholder-val="{{true}}"><dc-import name="Obj-Detail" kind="{{s.kind}}" state="{{s.state}}" hint-size="390px,1280px"></dc-import></sc-if>
        <sc-if value="{{s.ad}}" hint-placeholder-val="{{false}}"><dc-import name="Obj-Add" kind="{{s.kind}}" state="{{s.state}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.tx}}" hint-placeholder-val="{{false}}"><dc-import name="Tx-Add" type="{{s.kind}}" mode="{{s.state}}" hint-size="390px,844px"></dc-import></sc-if>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":4866,"height":1420}}'>
class Component extends DCLogic {
  renderVals() {
    const I = (c, kind, state, t, d) => ({ kind, state, t, d, l: c === 'l', dt: c === 'dt', ad: c === 'ad', tx: c === 'tx',
      frame: 'width: 390px; height: ' + (c === 'dt' && state !== 'sheet' ? 1280 : 844) + 'px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(6,36,27,0.55)' });
    return { items: [
      I('l', 'accounts', 'default', 'Accounts', 'Balances, primary account, archived kept separate. Long-press to reorder.'),
      I('dt', 'account', 'default', 'Account detail', 'Balance, this month’s flow, and what this account will pay next.'),
      I('dt', 'account', 'sheet', 'Archive account', 'Hidden, never deleted — history stays in reports.'),
      I('ad', 'account', 'new', 'Add account', 'Type chips, name, balance. Voice shortcut on top.'),
      I('l', 'accounts', 'empty', 'Accounts · empty', 'KAI helps create the first account.'),
      I('l', 'cards', 'default', 'Credit cards', 'What you owe, what’s due, limit used — visually.'),
      I('dt', 'card', 'default', 'Card detail', 'Spends → statement → bill → due → settled, with today highlighted.'),
      I('tx', 'cardpay', 'new', 'Pay card bill', 'A settlement, not an expense. Total, minimum or custom.'),
      I('dt', 'card', 'sheet', 'Payment recorded', 'Outstanding updates instantly.'),
      I('ad', 'card', 'new', 'Add card', 'Never the full card number, CVV or PIN.'),
      I('l', 'cards', 'empty', 'Cards · empty', 'Explains what KAI tracks for a card.')
    ] };
  }
}
</script>
</body>
</html>
