<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — Achievements</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#0B3D2E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 6px"><a href="Goals.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="back" size="22" hint-size="22px,22px"></dc-import></a><h1 style="margin: 0; font-family: Nunito, sans-serif; font-weight: 800; font-size: 26px">Achievements</h1></div>
    <div style="position: relative; border-radius: 24px; overflow: hidden">
      <div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="World" tone="peach" ribbon="{{false}}" hint-size="100%,100%"></dc-import></div>
      <div style="position: relative; z-index: 1; padding: 16px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 120px; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12.5px; font-weight: 800; color: #A8361F; letter-spacing: 0.06em; text-transform: uppercase">Saving streak</span><b style="font-size: 30px">7 months</b><span style="font-size: 13px; color: #3D4B45">You’ve saved something every month since March.</span></div>
        <dc-import name="Scene" scene="encouraging" w="124" h="100" hint-size="124px,100px"></dc-import>
      </div>
    </div>
    <span style="font-size: 12.5px; font-weight: 800; color: #5F6E67; letter-spacing: 0.06em; text-transform: uppercase">Earned · 6 of 9</span>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{badges}}" as="b" hint-placeholder-count="9">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; background: #FFFFFF; border-radius: 18px; padding: 12px 6px; box-shadow: 0 10px 22px -20px rgba(6,36,27,0.45)">
          <span style="{{b.medal}}"><dc-import name="Icon" icon="{{b.i}}" size="24" color="{{b.ic}}" hint-size="24px,24px"></dc-import></span>
          <b style="{{b.ts}}">{{b.t}}</b><span style="font-size: 10.5px; color: #5F6E67; line-height: 1.3">{{b.d}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size: 12px; color: #5F6E67; text-align: center">Achievements reward healthy habits — never spending.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const B = (t, d, i, on) => ({ t, d, i, ic: on ? '#FFFFFF' : '#B9C4BF',
      medal: 'width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; ' + (on ? 'background: radial-gradient(circle at 35% 30%, #8CF0CB 0%, #22A06B 60%, #126B4B 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.5), 0 8px 14px -8px rgba(23,128,90,0.7);' : 'background: #F2F4F3; border: 2px dashed #DCD8CF;'),
      ts: 'font-size: 12.5px; ' + (on ? '' : 'color: #94A39C;') });
    return { badges: [
      B('First goal', 'Gift goal completed', 'flag', 1), B('30 days', 'Saved for a month', 'savings', 1), B('Under budget', 'September dining', 'pie', 1),
      B('First SIP', 'Investing habit started', 'invest', 1), B('100 entries', 'Tracked 100 transactions', 'list', 1), B('EMI-free', 'Pay off an EMI', 'emi', 0),
      B('Safety net', '3-month emergency fund', 'shield', 0), B('6-month streak', 'Save 6 months in a row', 'star', 1), B('Voice pro', '50 entries by voice', 'mic', 0)
    ] };
  }
}
</script>
</body>
</html>
