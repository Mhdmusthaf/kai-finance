<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in, lock and permissions — states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 48px; padding: 40px 48px 48px; background: #EEE9DF; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; width: max-content">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: Nunito, sans-serif; font-size: 20px">{{s.t}}</b><span style="font-size: 13px; color: #5F6E67; max-width: 390px; min-height: 36px">{{s.d}}</span></div>
      <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(6,36,27,0.55)"><dc-import name="Auth" mode="{{s.k}}" hint-size="390px,844px"></dc-import></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2724,"height":1030}}'>
class Component extends DCLogic {
  renderVals() {
    return { states: [
      { k: 'otp', t: 'Verify code', d: 'Auto-read where the OS allows; clear resend timer.' },
      { k: 'pin', t: 'Set a PIN', d: 'Backup to biometrics; custom keypad with Face ID shortcut.' },
      { k: 'lock', t: 'App lock', d: 'Every cold start and after 5 min in background. KAI as guardian, not alarm.' },
      { k: 'mic', t: 'Microphone primer', d: 'Explained before the system prompt, so the “Allow” makes sense.' },
      { k: 'notifications', t: 'Notifications primer', d: 'Useful reminders, quiet hours on by default.' },
      { k: 'expired', t: 'Session expired', d: 'Calm and reassuring — no data lost.' }
    ] };
  }
}
</script>
</body>
</html>
