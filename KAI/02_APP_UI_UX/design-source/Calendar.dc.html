<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — Financial calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#0B3D2E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="Upcoming.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="back" size="22" hint-size="22px,22px"></dc-import></a>
      <h1 style="flex: 1; margin: 0; font-family: Nunito, sans-serif; font-weight: 800; font-size: 24px">October 2026</h1>
      <button type="button" aria-label="Previous month" style="width: 40px; height: 40px; border-radius: 12px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="back" size="18" hint-size="18px,18px"></dc-import></button>
      <button type="button" aria-label="Next month" style="width: 40px; height: 40px; border-radius: 12px; border: none; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="chevron" size="18" hint-size="18px,18px"></dc-import></button>
    </div>
    <div style="display: flex; gap: 8px"><span style="flex: 1; background: #D8F3E5; border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #126B4B">Coming in</span><b style="font-variant-numeric: tabular-nums">₹1,40,000</b></span><span style="flex: 1; background: #FFFFFF; border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #5F6E67">Committed out</span><b style="font-variant-numeric: tabular-nums">₹79,062</b></span><span style="flex: 1; background: #FFFFFF; border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column"><span style="font-size: 11px; color: #5F6E67">Still to go</span><b style="font-variant-numeric: tabular-nums">₹56,563</b></span></div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 12px; box-shadow: 0 12px 26px -22px rgba(6,36,27,0.45)">
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); text-align: center; font-size: 11.5px; font-weight: 800; color: #94A39C; padding-bottom: 6px"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 4px">
        <sc-for list="{{cells}}" as="c" hint-placeholder-count="35"><button type="button" aria-label="{{c.a}}" style="{{c.s}}"><span style="{{c.n}}">{{c.d}}</span><span style="display: flex; gap: 2px; height: 6px"><sc-for list="{{c.dots}}" as="dot" hint-placeholder-count="2"><span style="{{dot}}"></span></sc-for></span></button></sc-for>
      </div>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 11.5px; color: #5F6E67"><sc-for list="{{legend}}" as="l" hint-placeholder-count="6"><span style="display: flex; align-items: center; gap: 5px"><span style="{{l.dot}}"></span>{{l.t}}</span></sc-for></div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12.5px; font-weight: 800; color: #5F6E67; text-transform: uppercase; letter-spacing: 0.04em">Wed 7 Oct</span>
      <a href="Calendar-States.dc.html" style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; box-shadow: 0 10px 22px -20px rgba(6,36,27,0.45)"><span style="width: 44px; height: 44px; border-radius: 14px; background: #FFE8E0; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="card" size="20" color="#A8361F" hint-size="20px,20px"></dc-import></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 14.5px">SBI card bill due</b><span style="font-size: 12px; color: #5F6E67">September statement · minimum ₹910</span></span><b style="font-size: 15px">₹18,240</b></a>
    </div>
  </div>

  <sc-if value="{{event}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 10; background: rgba(6,36,27,0.42)"></div>
    <div role="dialog" aria-label="SBI card bill" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; background: #FCFBF8; border-radius: 28px 28px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; gap: 14px">
      <span style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #DCD8CF"></span>
      <div style="display: flex; align-items: center; gap: 12px"><span style="width: 52px; height: 52px; border-radius: 16px; background: #FFE8E0; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="card" size="24" color="#A8361F" hint-size="24px,24px"></dc-import></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-family: Nunito, sans-serif; font-size: 20px">SBI card bill</b><span style="font-size: 13px; color: #5F6E67">Due Wed 7 Oct · in 3 days</span></span><b style="font-size: 24px">₹18,240</b></div>
      <div style="display: flex; align-items: center; gap: 4px; background: #FFFFFF; border-radius: 16px; padding: 10px"><sc-for list="{{chain}}" as="c" hint-placeholder-count="5"><span style="{{c.s}}">{{c.t}}</span></sc-for></div>
      <div style="background: #FFFFFF; border-radius: 16px; padding: 4px 14px"><sc-for list="{{facts}}" as="f" hint-placeholder-count="4"><div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #F2EFE8; font-size: 14px"><span style="color: #5F6E67">{{f.k}}</span><b>{{f.v}}</b></div></sc-for></div>
      <div style="display: flex; gap: 10px"><span style="flex: 1; height: 52px; border-radius: 999px; border: 1.5px solid #E2DCCF; display: flex; align-items: center; justify-content: center; font-weight: 700">Remind me tomorrow</span><a href="Accounts-Flow.dc.html" style="flex: 1; height: 52px; border-radius: 999px; background: #0B3D2E; color: #FFF8F1; display: flex; align-items: center; justify-content: center; font-weight: 800">Record payment</a></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","event"],"default":"default"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const COL = { in: '#17805A', bill: '#E0A030', emi: '#9A5B00', card: '#C2412D', sip: '#3ED1A0', sub: '#8D74F0', ins: '#0B3D2E' };
    const ev = { 1: ['in', 'bill'], 2: ['bill'], 3: ['bill'], 5: ['sip', 'bill'], 7: ['card'], 10: ['emi'], 12: ['sub'], 14: ['bill'], 15: ['emi', 'sub'], 18: ['card'], 20: ['sip', 'sub'], 25: ['card'], 26: ['sub'] };
    const cells = [];
    for (let i = 0; i < 3; i++) cells.push({ d: '', a: '', s: 'height: 44px; border: none; background: transparent;', n: '', dots: [] });
    for (let d = 1; d <= 31; d++) {
      const sel = d === 7, today = d === 4, past = d < 4;
      cells.push({ d: String(d), a: d + ' October' + (ev[d] ? ', ' + ev[d].length + ' events' : ''),
        s: 'height: 44px; border: none; border-radius: 12px; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; ' + (sel ? 'background: #0B3D2E;' : today ? 'background: #D8F3E5;' : 'background: transparent;'),
        n: 'font-size: 14px; font-weight: ' + (sel || today ? 800 : 600) + '; color: ' + (sel ? '#FFF8F1' : past ? '#B9C4BF' : '#0B3D2E') + ';',
        dots: (ev[d] || []).map((t) => 'width: 5px; height: 5px; border-radius: 50%; background: ' + (sel ? '#3ED1A0' : COL[t]) + ';' + (past ? ' opacity: 0.4;' : '')) });
    }
    while (cells.length % 7) cells.push({ d: '', a: '', s: 'height: 44px; border: none; background: transparent;', n: '', dots: [] });
    const C = (arr, cur) => arr.map((t, i) => ({ t, s: 'flex: 1; text-align: center; padding: 6px 2px; border-radius: 10px; font-size: 11px; font-weight: 800; ' + (i === cur ? 'background: #0B3D2E; color: #FFF8F1;' : i < cur ? 'color: #17805A;' : 'color: #94A39C;') }));
    return {
      cells, event: (this.props.state ?? 'default') === 'event',
      legend: [['Income', 'in'], ['Bills', 'bill'], ['EMIs', 'emi'], ['Card dues', 'card'], ['SIPs', 'sip'], ['Subscriptions', 'sub']].map(([t, k]) => ({ t, dot: 'width: 8px; height: 8px; border-radius: 50%; background: ' + COL[k] + ';' })),
      chain: C(['Spends', 'Statement', 'Bill', 'Due', 'Settled'], 3),
      facts: [{ k: 'Statement', v: '25 Sep · ₹18,240' }, { k: 'Minimum due', v: '₹910' }, { k: 'Pay from', v: 'HDFC Savings' }, { k: 'Reminder', v: 'Sent today, 9:00 AM' }]
    };
  }
}
</script>
</body>
</html>
