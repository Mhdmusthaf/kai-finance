<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — 3D Environments</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 1300px; box-sizing: border-box; padding: 56px 72px; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; display: flex; flex-direction: column; gap: 30px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #17805A">10 — The KAI World · 3D Environments</span>
      <h1 style="margin: 0; font-family: Nunito, sans-serif; font-weight: 800; font-size: 52px; letter-spacing: -0.02em">Where KAI lives</h1>
    </div>
    <span style="max-width: 600px; font-size: 16px; line-height: 1.55; color: #5F6E67">A soft curved floor, one flowing ribbon (money moving, calmly organised) and a few floating orbs (goals and progress). No coins, no currency symbols, no buildings — KAI is the financial experience.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
    <sc-for list="{{worlds}}" as="w" hint-placeholder-count="9">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="position: relative; height: 290px; border-radius: 26px; overflow: hidden; box-shadow: 0 28px 56px -34px rgba(6,36,27,0.45)">
          <div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="World" tone="{{w.tone}}" flip="{{w.flip}}" hint-size="100%,100%"></dc-import></div>
          <div style="position: relative; z-index: 1; height: 100%; display: flex; align-items: center; justify-content: center">
            <dc-import name="Mascot" expr="{{w.expr}}" glow="{{w.glow}}" hint-size="210px,210px" style="width: 210px; height: 210px; margin-top: 18px"></dc-import>
          </div>
          <span style="{{w.tag}}">{{w.k}}</span>
        </div>
        <div style="display: flex; justify-content: space-between; gap: 12px"><b style="font-size: 15px">{{w.n}}</b><span style="font-size: 12.5px; color: #5F6E67; text-align: right">{{w.d}}</span></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const tag = (dark) => 'position: absolute; z-index: 2; top: 16px; left: 16px; font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; ' + (dark ? 'background: rgba(255,248,241,0.14); color: #D8F3E5;' : 'background: rgba(255,255,255,0.8); color: #0B3D2E;');
    const w = (k, n, d, tone, expr, dark, flip) => ({ k, n, d, tone, expr, glow: !!dark, flip: !!flip, tag: tag(dark) });
    return { worlds: [
      w('A', 'Cream World', 'Default. Product, web, onboarding.', 'cream', 'default'),
      w('B', 'Forest World', 'Dark mode, statements, launches.', 'forest', 'insight', true, true),
      w('C', 'Mint World', 'Success, growth, celebrations.', 'mint', 'happy'),
      w('D', 'Dark Premium World', 'Voice, video, keynote moments.', 'dark', 'listening', true),
      w('E1', 'Cream → Mint', 'Soft gradient. Onboarding, social.', 'creamMint', 'waving', false, true),
      w('E2', 'Forest → Green', 'Soft gradient. Campaign headers.', 'forestGreen', 'celebrating', true),
      w('E3', 'Lavender → Cream', 'Soft gradient. AI insight moments.', 'lavenderCream', 'thinking'),
      w('F', 'Lavender Accent', 'Insights, “KAI noticed…”.', 'lavender', 'insight', false, true),
      w('G', 'Peach Accent', 'Reminders, gentle nudges.', 'peach', 'reminder')
    ] };
  }
}
</script>
</body>
</html>
