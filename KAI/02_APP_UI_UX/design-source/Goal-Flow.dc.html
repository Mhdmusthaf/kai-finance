<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Goals — flow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 48px; padding: 40px 48px 48px; background: #EEE9DF; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; width: max-content; align-items: flex-start">
  <sc-for list="{{items}}" as="s" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: Nunito, sans-serif; font-size: 20px">{{s.t}}</b><span style="font-size: 13px; color: #5F6E67; max-width: 390px; min-height: 36px">{{s.d}}</span></div>
      <div style="{{s.frame}}">
        <sc-if value="{{s.Upcoming}}" hint-placeholder-val="{{false}}"><dc-import name="Upcoming" state="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Calendar}}" hint-placeholder-val="{{false}}"><dc-import name="Calendar" state="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Goals}}" hint-placeholder-val="{{false}}"><dc-import name="Goals" state="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Goal}}" hint-placeholder-val="{{true}}"><dc-import name="Goal" mode="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Achievements}}" hint-placeholder-val="{{false}}"><dc-import name="Achievements" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Insights}}" hint-placeholder-val="{{false}}"><dc-import name="Insights" state="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.InsightDetail}}" hint-placeholder-val="{{false}}"><dc-import name="Insight-Detail" hint-size="390px,1240px"></dc-import></sc-if>
        <sc-if value="{{s.Ask}}" hint-placeholder-val="{{false}}"><dc-import name="Ask" state="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.CashFlow}}" hint-placeholder-val="{{false}}"><dc-import name="CashFlow" hint-size="390px,1100px"></dc-import></sc-if>
        <sc-if value="{{s.NetWorth}}" hint-placeholder-val="{{false}}"><dc-import name="NetWorth" hint-size="390px,1240px"></dc-import></sc-if>
        <sc-if value="{{s.Reports}}" hint-placeholder-val="{{false}}"><dc-import name="Reports" hint-size="390px,1000px"></dc-import></sc-if>
        <sc-if value="{{s.Recap}}" hint-placeholder-val="{{false}}"><dc-import name="Recap" page="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Owed}}" hint-placeholder-val="{{false}}"><dc-import name="Owed" state="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Vault}}" hint-placeholder-val="{{false}}"><dc-import name="Vault" state="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2724,"height":1030}}'>
class Component extends DCLogic {
  renderVals() {
    const C = ['Upcoming', 'Calendar', 'Goals', 'Goal', 'Achievements', 'Insights', 'InsightDetail', 'Ask', 'CashFlow', 'NetWorth', 'Reports', 'Recap', 'Owed', 'Vault'];
    const I = (c, p, h, t, d) => { const o = { p, t, d, frame: 'width: 390px; height: ' + h + 'px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(6,36,27,0.55)' }; C.forEach((k) => { o[k] = k === c; }); return o; };
    return { items: [
      I('Goals', 'empty', 844, 'Goals · empty', 'KAI waving toward an empty goal flag.'),
      I('Goal', 'create', 844, 'Create goal', 'Name, target, date — KAI shows the monthly step as a labelled calculation.'),
      I('Goal', 'detail', 844, 'Goal detail', 'Goal → target → saving → progress → done, with every contribution.'),
      I('Goal', 'complete', 844, 'Goal completed', 'Celebration that feels premium: mint world, one achievement, share and next step.'),
      I('Achievements', '', 844, 'Achievements', 'Healthy habits only — streaks and milestones, never spending.'),
      I('Goals', 'default', 844, 'Goals · with a finished goal', 'Completed goals stay as proud history.')
    ] };
  }
}
</script>
</body>
</html>
