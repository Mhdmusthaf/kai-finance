<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home — states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 48px; padding: 40px 48px 48px; background: #EEE9DF; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; width: max-content">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="4">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: Nunito, sans-serif; font-size: 20px">{{s.t}}</b><span style="font-size: 13px; color: #5F6E67; max-width: 390px">{{s.d}}</span></div>
      <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(6,36,27,0.55)"><dc-import name="Home" state="{{s.k}}" hint-size="390px,844px"></dc-import></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1896,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return { states: [
      { k: 'empty', t: 'First time', d: 'No data yet: KAI welcomes, three-step setup, voice as the fastest start.' },
      { k: 'loading', t: 'Loading', d: 'Skeleton keeps layout stable; KAI processing scene instead of a spinner.' },
      { k: 'toast', t: 'Added via voice + Undo', d: 'Simple entries save instantly; a 6-second undo snackbar sits above the tab bar.' },
      { k: 'offline', t: 'Offline', d: 'Last-synced time is honest; new entries queue and sync later. (Full scroll on the Home board.)' }
    ] };
  }
}
</script>
</body>
</html>
