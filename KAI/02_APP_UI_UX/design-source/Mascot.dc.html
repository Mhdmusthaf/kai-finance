<script type="text/x-dc" data-dc-script data-props='{"expr":{"editor":"enum","options":["default","listening","thinking","insight","happy","celebrating","reminder","concerned","sleeping","waving"],"default":"default"},"render":{"editor":"enum","options":["3d","flat","mono"],"default":"3d"},"glow":{"editor":"boolean","default":false},"shadow":{"editor":"boolean","default":true},"mono":{"editor":null,"default":false},"monoColor":{"editor":"color","default":"#0B3D2E","options":["#0B3D2E","#FFFFFF","#1A1A1A","#17805A"]},"flat":{"editor":null,"default":false},"body":{"editor":null,"default":"#FFFFFF"},"edge":{"editor":null,"default":"#E3EBE5"},"shade":{"editor":null,"default":"#8ED8B4"},"leaf":{"editor":null,"default":"#22A06B"},"ink":{"editor":null,"default":"#0B2A20"},"$preview":{"width":400,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    if (!this._id) this._id = 'k' + Math.random().toString(36).slice(2, 9);
    const p = this.props;
    const id = this._id;
    const e = p.expr ?? 'default';
    let mode = p.render ?? '3d';
    if (p.mono) mode = 'mono';
    else if (p.flat) mode = 'flat';
    const is3d = mode === '3d';
    const on = (b) => (b ? 'inline' : 'none');
    const is = (...l) => l.indexOf(e) !== -1;
    const ink = p.ink ?? '#0B2A20';
    return {
      gClip: id + 'c', fB2: id + 'f2', fB4: id + 'f4', fB8: id + 'f8', fB16: id + 'f16',
      gBody3: id + 'b3', gBounce: id + 'bn', gAO: id + 'ao', gArm: id + 'ar', gArmL: id + 'al', gFoot: id + 'ft',
      gLeaf3: id + 'l3', gSheen: id + 'sh', gEye: id + 'ey', gIris: id + 'ir', gBell: id + 'bl', gBodyF: id + 'bf', gShadeF: id + 'sf',
      body: p.body ?? '#FFFFFF', edge: p.edge ?? '#E3EBE5', shade: p.shade ?? '#8ED8B4', leaf: p.leaf ?? '#22A06B', ink,
      monoColor: p.monoColor ?? '#0B3D2E',
      show3d: on(is3d), showFlat: on(mode === 'flat'), showMono: on(mode === 'mono'), showFace: on(mode !== 'mono'),
      showShadow: on(p.shadow ?? true), showGlow: on(is3d && !!p.glow),
      rimColor: p.glow ? '#6FF0C2' : '#FFFFFF', rimOp: p.glow ? 0.9 : 0.35,
      eyeFill: is3d ? 'url(#' + id + 'ey)' : ink,
      irisFill: is3d ? 'url(#' + id + 'ir)' : (p.leaf ?? '#22A06B'), irisOp: is3d ? 1 : 0.7,
      eyesOpen: on(is('default', 'thinking', 'insight', 'reminder', 'concerned', 'waving')),
      eyeX: is('thinking') ? 3 : 0, eyeY: is('thinking') ? -3 : 0,
      eyesHappy: on(is('happy', 'celebrating')),
      eyesClosed: on(is('listening', 'sleeping')),
      brows: on(is('concerned')),
      mouthOpen: on(is('default', 'insight', 'waving')),
      mouthBig: on(is('happy', 'celebrating')),
      mouthSmile: on(is('listening', 'sleeping')),
      mouthO: on(is('thinking', 'reminder')),
      mouthWorry: on(is('concerned')),
      waves: on(is('listening')), dots: on(is('thinking')), spark: on(is('insight', 'waving')),
      bell: on(is('reminder')), confetti: on(is('celebrating')), zz: on(is('sleeping')),
      armRightUp: on(is('waving', 'celebrating')), armRightDown: on(!is('waving', 'celebrating')),
      armLeftUp: on(is('celebrating')), armLeftDown: on(!is('celebrating'))
    };
  }
}
