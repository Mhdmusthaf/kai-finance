<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — My Money</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#0B3D2E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1100px; overflow: hidden; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E">
  <div style="padding: 58px 20px 120px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between"><h1 style="margin: 0; font-family: Nunito, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">My Money</h1><a href="Obj-Add-States.dc.html" aria-label="Add" style="width: 44px; height: 44px; border-radius: 14px; background: #0B3D2E; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="plus" size="22" color="#3ED1A0" hint-size="22px,22px"></dc-import></a></div>
    <a href="NetWorth.dc.html" style="position: relative; border-radius: 26px; overflow: hidden; box-shadow: 0 24px 40px -26px rgba(6,36,27,0.6)">
      <div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="World" tone="forest" orbs="{{false}}" hint-size="100%,100%"></dc-import></div>
      <div style="position: relative; z-index: 1; padding: 18px 20px; color: #FFF8F1; display: grid; grid-template-columns: minmax(0, 1fr) 112px; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #94B3A1">Net worth</span><b style="font-size: 32px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">₹24,80,000</b><span style="font-size: 12.5px; color: #D8F3E5; font-variant-numeric: tabular-nums">You own ₹28,79,250 · you owe ₹3,99,250</span></div>
        <dc-import name="Scene" scene="investing" w="120" h="96" dark="{{true}}" hint-size="120px,96px"></dc-import>
      </div>
    </a>
    <span style="font-size: 12.5px; font-weight: 800; color: #5F6E67; letter-spacing: 0.06em; text-transform: uppercase">What you have</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><sc-for list="{{have}}" as="t" hint-placeholder-count="4"><a href="{{t.href}}" style="{{t.s}}"><span style="{{t.chip}}"><dc-import name="Icon" icon="{{t.i}}" size="20" color="{{t.ic}}" hint-size="20px,20px"></dc-import></span><span style="font-size: 13px; font-weight: 700; color: #5F6E67">{{t.t}}</span><b style="font-size: 18px; font-variant-numeric: tabular-nums">{{t.v}}</b><span style="font-size: 11.5px; color: #5F6E67">{{t.d}}</span></a></sc-for></div>
    <span style="font-size: 12.5px; font-weight: 800; color: #5F6E67; letter-spacing: 0.06em; text-transform: uppercase">What you owe &amp; pay</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><sc-for list="{{owe}}" as="t" hint-placeholder-count="4"><a href="{{t.href}}" style="{{t.s}}"><span style="{{t.chip}}"><dc-import name="Icon" icon="{{t.i}}" size="20" color="{{t.ic}}" hint-size="20px,20px"></dc-import></span><span style="font-size: 13px; font-weight: 700; color: #5F6E67">{{t.t}}</span><b style="font-size: 18px; font-variant-numeric: tabular-nums">{{t.v}}</b><span style="font-size: 11.5px; color: #5F6E67">{{t.d}}</span></a></sc-for></div>
    <span style="font-size: 12.5px; font-weight: 800; color: #5F6E67; letter-spacing: 0.06em; text-transform: uppercase">Plans &amp; records</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><sc-for list="{{plans}}" as="t" hint-placeholder-count="4"><a href="{{t.href}}" style="{{t.s}}"><span style="{{t.chip}}"><dc-import name="Icon" icon="{{t.i}}" size="20" color="{{t.ic}}" hint-size="20px,20px"></dc-import></span><span style="font-size: 13px; font-weight: 700; color: #5F6E67">{{t.t}}</span><b style="font-size: 18px; font-variant-numeric: tabular-nums">{{t.v}}</b><span style="font-size: 11.5px; color: #5F6E67">{{t.d}}</span></a></sc-for></div>
  </div>
  <dc-import name="TabBar" active="money" hint-size="390px,84px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const T = (t, v, d, i, href, bg, ic) => ({ t, v, d, i, href, ic: ic || '#17805A',
      chip: 'width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; background: ' + (bg || '#D8F3E5') + ';',
      s: 'background: #FFFFFF; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 12px 26px -22px rgba(6,36,27,0.45);' });
    return {
      have: [T('Accounts', '₹1,42,500', '4 accounts', 'bank', 'Accounts-Flow.dc.html'), T('Investments', '₹4,86,300', '+15.8% · 2 SIPs', 'invest', 'Invest-Flow.dc.html'),
        T('Other assets', '₹22,45,950', 'EPF, car, gold, plot', 'networth', 'NetWorth.dc.html'), T('Owed to you', '₹4,500', 'Priya, Kunal', 'people', 'Owed-Docs-Flow.dc.html')],
      owe: [T('Credit cards', '₹28,250', '₹18,240 due Wed', 'card', 'Accounts-Flow.dc.html', '#FFE8E0', '#A8361F'), T('Loans & EMIs', '₹3,69,800', '₹16,950 a month', 'loan', 'Debt-Flow.dc.html', '#FFF1DC', '#9A5B00'),
        T('Bills', '₹3,610', 'left this month', 'bills', 'Recurring-Flow.dc.html', '#FFF1DC', '#9A5B00'), T('Subscriptions', '₹3,840/mo', '6 active', 'repeat', 'Recurring-Flow.dc.html', '#E9E3FF', '#5B40C9')],
      plans: [T('Goals', '2 active', 'Goa trip 82%', 'goals', 'Goals.dc.html'), T('Insurance', '₹1.10 Cr', 'cover · 3 policies', 'shield', 'Recurring-Flow.dc.html'),
        T('Documents', '14 files', 'Encrypted vault', 'folder', 'Owed-Docs-Flow.dc.html', '#E9E3FF', '#5B40C9'), T('Reports', 'October', 'Spending, income, net worth', 'reports', 'Reports.dc.html', '#F2F4F3', '#0B3D2E')]
    };
  }
}
</script>
</body>
</html>
