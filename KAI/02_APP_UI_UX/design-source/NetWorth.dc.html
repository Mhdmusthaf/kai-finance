<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — Net worth</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#0B3D2E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1240px; overflow: hidden; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 6px"><a href="MyMoney.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="back" size="22" hint-size="22px,22px"></dc-import></a><h1 style="margin: 0; font-family: Nunito, sans-serif; font-weight: 800; font-size: 26px">Net worth</h1></div>
    <div style="position: relative; border-radius: 26px; overflow: hidden; box-shadow: 0 24px 40px -26px rgba(6,36,27,0.6)">
      <div style="position: absolute; inset: 0; pointer-events: none"><dc-import name="World" tone="forest" orbs="{{false}}" ribbon="{{false}}" hint-size="100%,100%"></dc-import></div>
      <div style="position: relative; z-index: 1; padding: 18px 18px 10px; color: #FFF8F1; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 13px; color: #94B3A1">What you own − what you owe</span>
        <b style="font-size: 36px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">₹24,80,000</b>
        <span style="font-size: 13px; font-weight: 700; color: #3ED1A0">+₹3,12,000 in 12 months · +14.4%</span>
        <svg viewBox="0 0 330 120" width="100%" height="120" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="margin-top: 6px"><defs><linearGradient id="nwf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3ED1A0" stop-opacity="0.35"></stop><stop offset="1" stop-color="#3ED1A0" stop-opacity="0"></stop></linearGradient></defs><path d="M0 92 L30 88 L60 90 L90 80 L120 76 L150 78 L180 66 L210 60 L240 54 L270 46 L300 40 L330 30 L330 120 L0 120 Z" fill="url(#nwf)"></path><path d="M0 92 L30 88 L60 90 L90 80 L120 76 L150 78 L180 66 L210 60 L240 54 L270 46 L300 40 L330 30" fill="none" stroke="#3ED1A0" stroke-width="2.5" stroke-linejoin="round"></path><circle cx="330" cy="30" r="4" fill="#3ED1A0"></circle></svg>
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: #94B3A1"><span>Oct 2025</span><span>Apr 2026</span><span>Now</span></div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px"><div style="background: #D8F3E5; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #126B4B; font-weight: 700">You own</span><b style="font-size: 20px; font-variant-numeric: tabular-nums">₹28,79,250</b></div><div style="background: #FFE8E0; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column"><span style="font-size: 12px; color: #A8361F; font-weight: 700">You owe</span><b style="font-size: 20px; font-variant-numeric: tabular-nums">₹3,99,250</b></div></div>
    <sc-for list="{{blocks}}" as="b" hint-placeholder-count="2">
      <div style="background: #FFFFFF; border-radius: 22px; padding: 6px 16px; box-shadow: 0 12px 26px -22px rgba(6,36,27,0.45)">
        <b style="display: block; font-family: Nunito, sans-serif; font-size: 16px; padding: 10px 0 4px">{{b.t}}</b>
        <sc-for list="{{b.rows}}" as="r" hint-placeholder-count="5"><div style="display: flex; flex-direction: column; gap: 6px; padding: 9px 0; border-top: 1px solid #F2EFE8"><div style="display: flex; justify-content: space-between; font-size: 14px"><span>{{r.t}}</span><b style="font-variant-numeric: tabular-nums">{{r.v}}</b></div><div style="height: 6px; border-radius: 999px; background: #F2F4F3"><div style="{{r.bar}}"></div></div></div></sc-for>
      </div>
    </sc-for>
    <span style="font-size: 12px; color: #5F6E67; line-height: 1.5">Car, gold and property use values you entered; update them anytime. Investments use the latest values you or your apps provided.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const A = 2879250, L = 399250;
    const row = (t, v, n, c, tot) => ({ t, v, bar: 'width: ' + Math.max(2, Math.round(n / tot * 100)) + '%; height: 100%; border-radius: 999px; background: ' + c + ';' });
    return { blocks: [
      { t: 'Assets', rows: [row('EPF', '₹6,41,950', 641950, '#17805A', A), row('Car (your estimate)', '₹6,04,000', 604000, '#17805A', A), row('Plot share', '₹6,00,000', 600000, '#17805A', A), row('Investments', '₹4,86,300', 486300, '#3ED1A0', A), row('Gold', '₹4,00,000', 400000, '#F7A47F', A), row('Cash & bank', '₹1,42,500', 142500, '#3ED1A0', A), row('Owed to you', '₹4,500', 4500, '#94B3A1', A)] },
      { t: 'Liabilities', rows: [row('Car loan', '₹3,42,800', 342800, '#A8361F', L), row('Credit cards', '₹28,250', 28250, '#E2643F', L), row('Laptop EMI', '₹27,000', 27000, '#E0A030', L), row('You owe Ananya', '₹1,200', 1200, '#94B3A1', L)] }
    ] };
  }
}
</script>
</body>
</html>
