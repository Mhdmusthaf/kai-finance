<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — Add financial object</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#0B3D2E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="MyMoney.dc.html" aria-label="Close" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="close" size="22" hint-size="22px,22px"></dc-import></a>
      <b style="font-family: Nunito, sans-serif; font-size: 18px">{{title}}</b>
      <span style="width: 34px"></span>
    </div>
    <a href="VoiceFlow.dc.html" style="display: flex; align-items: center; gap: 12px; background: #0B3D2E; color: #FFF8F1; border-radius: 18px; padding: 12px 14px">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: rgba(62,209,160,0.16); display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="mic" size="20" color="#3ED1A0" hint-size="20px,20px"></dc-import></span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px; color: #94B3A1">Faster: just say it</span><b style="font-size: 14px; line-height: 1.35">{{voice}}</b></span>
    </a>
    <sc-if value="{{hasChips}}" hint-placeholder-val="{{true}}"><div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><span style="{{c.s}}">{{c.t}}</span></sc-for></div></sc-if>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="6">
        <label style="display: flex; flex-direction: column; gap: 4px; background: #FFFFFF; border-radius: 16px; padding: 10px 14px; border: {{f.b}}">
          <span style="font-size: 12px; font-weight: 700; color: #5F6E67">{{f.k}}</span>
          <span style="display: flex; align-items: center; gap: 8px"><input type="text" value="{{f.v}}" style="border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 700; color: #0B3D2E; flex: 1; min-width: 0; font-variant-numeric: tabular-nums"><sc-if value="{{f.pick}}" hint-placeholder-val="{{false}}"><dc-import name="Icon" icon="down" size="18" color="#94A39C" hint-size="18px,18px"></dc-import></sc-if></span>
        </label>
      </sc-for>
    </div>
    <span style="font-size: 12.5px; color: #5F6E67; line-height: 1.5">{{footnote}}</span>
  </div>
  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px"><a href="Obj-Add-States.dc.html" style="height: 56px; border-radius: 999px; background: #0B3D2E; color: #FFF8F1; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; box-shadow: 0 16px 30px -16px rgba(6,36,27,0.6)">{{cta}}</a></div>

  <sc-if value="{{success}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 10; background: rgba(6,36,27,0.42)"></div>
    <div role="dialog" aria-label="Added" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; background: #FCFBF8; border-radius: 28px 28px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px">
      <span style="width: 40px; height: 5px; border-radius: 3px; background: #DCD8CF"></span>
      <dc-import name="Scene" scene="success" w="240" h="180" hint-size="240px,180px"></dc-import>
      <b style="font-family: Nunito, sans-serif; font-size: 22px">{{okTitle}}</b>
      <span style="font-size: 14px; line-height: 1.5; color: #3D4B45; max-width: 310px">{{okBody}}</span>
      <div style="display: flex; gap: 10px; align-self: stretch; margin-top: 8px"><span style="flex: 1; height: 52px; border-radius: 999px; border: 1.5px solid #E2DCCF; display: flex; align-items: center; justify-content: center; font-weight: 700">Add another</span><span style="flex: 1.3; height: 52px; border-radius: 999px; background: #0B3D2E; color: #FFF8F1; display: flex; align-items: center; justify-content: center; font-weight: 800">Done</span></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["account","card","emi","loan","sip","policy","bill","sub","receivable"],"default":"account"},"state":{"editor":"enum","options":["new","success"],"default":"new"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'account';
    const pill = (on) => 'padding: 9px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 700; ' + (on ? 'background: #0B3D2E; color: #FFF8F1;' : 'background: #FFFFFF; border: 1px solid #E6E1D6;');
    const F = (kk, v, pick, focus) => ({ k: kk, v, pick: !!pick, b: focus ? '2px solid #17805A' : '1.5px solid #EEEAE1' });
    const D = {
      account: { title: 'Add account', voice: '“I have 48,000 in my SBI salary account”', chips: ['Savings', 'Current', 'Cash', 'Wallet', 'Other'],
        fields: [F('Name', 'SBI Savings', false, true), F('Bank', 'State Bank of India', true), F('Current balance', '₹48,200'), F('Last 4 digits (optional)', '7712'), F('Primary account', 'No', true)],
        footnote: 'Balances update as you add transactions. You can correct them anytime — KAI logs the adjustment.', cta: 'Add account', okTitle: 'SBI Savings added', okBody: 'Your total balance is now ₹1,42,500 across 4 accounts.' },
      card: { title: 'Add credit card', voice: '“SBI credit card, limit 60,000, due on the 7th”', chips: [],
        fields: [F('Card name', 'SBI SimplyCLICK', false, true), F('Last 4 digits', '4021'), F('Credit limit', '₹60,000'), F('Statement date', '25th of the month', true), F('Due date', '7th of the month', true), F('Current outstanding', '₹21,840')],
        footnote: 'KAI never asks for your full card number, CVV or PIN.', cta: 'Add card', okTitle: 'Card added', okBody: 'KAI will remind you 3 days before each due date — the first one is for 7 Oct.' },
      emi: { title: 'Add EMI', voice: '“My laptop EMI is 4,500 for 12 months, due on the 10th”', chips: ['No-cost', 'With interest'],
        fields: [F('What for', 'Laptop', false, true), F('Monthly EMI', '₹4,500'), F('Number of EMIs', '12'), F('Already paid', '6'), F('Due on', '10th of the month', true), F('Paid from', 'HDFC Credit Card ··7788', true)],
        footnote: 'KAI works out the end date (10 Mar 2027) and adds each instalment to Upcoming.', cta: 'Add EMI', okTitle: 'Laptop EMI added', okBody: '6 to go. I’ll remind you before the 10th each month.' },
      loan: { title: 'Add loan', voice: '“Car loan of 6 lakh at 9.1% for 5 years, EMI 12,450 on the 15th”', chips: ['Personal', 'Vehicle', 'Education', 'Home', 'Other'],
        fields: [F('Lender', 'HDFC Bank', false, true), F('Loan amount', '₹6,00,000'), F('Interest rate (yearly)', '9.1%'), F('Tenure', '60 months'), F('EMI', '₹12,450 on the 15th'), F('Outstanding today (optional)', '₹3,42,800')],
        footnote: 'Don’t know the outstanding? KAI estimates it from the start date and EMI.', cta: 'Add loan', okTitle: 'Car loan added', okBody: '43% repaid already. Next EMI is on 15 Oct.' },
      sip: { title: 'Add SIP', voice: '“I invest 5,000 every month in an SBI mutual fund SIP on the 5th”', chips: ['Monthly', 'Weekly', 'Quarterly'],
        fields: [F('Fund', 'SBI Bluechip Fund · Direct', true, true), F('Amount', '₹5,000'), F('Date', '5th of the month', true), F('From account', 'HDFC Savings', true), F('Started', 'Oct 2025', true), F('Current value (optional)', '₹68,450')],
        footnote: 'Each instalment shows up in Upcoming, then becomes an investment — never counted as spending.', cta: 'Add SIP', okTitle: 'SIP added', okBody: 'Next instalment tomorrow, Mon 5 Oct.' },
      policy: { title: 'Add insurance', voice: '“Health insurance from HDFC Ergo for 10 lakh, renewal every March”', chips: ['Health', 'Life', 'Vehicle', 'Travel', 'Other'],
        fields: [F('Provider', 'HDFC Ergo', true, true), F('Policy name', 'Optima Secure'), F('Cover', '₹10,00,000'), F('Premium', '₹18,600 / year'), F('Renewal date', '15 Mar 2027', true), F('Policy number (optional)', 'OS-•••• 3381')],
        footnote: 'Add the policy PDF afterwards — it’s stored encrypted in your vault.', cta: 'Add policy', okTitle: 'Policy added', okBody: 'I’ll remind you on 13 Feb, 30 days before renewal.' },
      bill: { title: 'Add bill', voice: '“Electricity bill around 2,000, due on the 5th”', chips: ['Electricity', 'Internet', 'Mobile', 'Rent', 'Water', 'Maintenance', 'School fees', 'Other'],
        fields: [F('Name', 'Electricity · BESCOM', false, true), F('Usual amount', '₹2,200 (varies)'), F('Due', '5th of every month', true), F('Pay from', 'HDFC Savings', true), F('Remind me', '2 days before', true)],
        footnote: 'For bills that vary, KAI uses your recent average and lets you confirm the real amount.', cta: 'Add bill', okTitle: 'Bill added', okBody: 'Next reminder: Sat 3 Oct for the 5 Oct due date.' },
      sub: { title: 'Add subscription', voice: '“Netflix 649 every month on my SBI card”', chips: ['Streaming', 'Music', 'Software', 'Cloud', 'Fitness', 'Other'],
        fields: [F('Name', 'Netflix', false, true), F('Amount', '₹649'), F('Billing cycle', 'Monthly', true), F('Next billing date', 'Mon 12 Oct', true), F('Paid with', 'SBI Credit Card', true)],
        footnote: 'KAI shows the yearly cost too: ₹7,788.', cta: 'Add subscription', okTitle: 'Netflix added', okBody: 'Subscriptions now total ₹3,840 a month.' },
      receivable: { title: 'Money owed to you', voice: '“Rahul owes me 3,000”', chips: ['Owed to me', 'I owe'],
        fields: [F('Person', 'Rahul Mehta', true, true), F('Amount', '₹3,000'), F('For', 'Concert tickets'), F('Date', 'Mon 28 Sep', true), F('Remind me', 'In 1 week', true)],
        footnote: 'When Rahul pays, say “Rahul paid me 3,000” — KAI settles it automatically.', cta: 'Save', okTitle: 'Noted', okBody: 'Rahul owes you ₹3,000. I’ll nudge you on 5 Oct.' }
    };
    const d = D[k];
    return Object.assign({}, d, {
      chips: d.chips.map((t, i) => ({ t, s: pill(i === 0) })), hasChips: d.chips.length > 0,
      success: (this.props.state ?? 'new') === 'success'
    });
  }
}
</script>
</body>
</html>
