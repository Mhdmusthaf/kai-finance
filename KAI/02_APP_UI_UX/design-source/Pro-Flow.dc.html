<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI Pro — flow</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 48px; padding: 40px 48px 48px; background: #EEE9DF; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; width: max-content; align-items: flex-start">
  <sc-for list="{{items}}" as="s" hint-placeholder-count="6">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: Nunito, sans-serif; font-size: 20px">{{s.t}}</b><span style="font-size: 13px; color: #5F6E67; max-width: 390px; min-height: 36px">{{s.d}}</span></div>
      <div style="{{s.frame}}">
        <sc-if value="{{s.Notifications}}" hint-placeholder-val="{{false}}"><dc-import name="Notifications" state="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Me}}" hint-placeholder-val="{{true}}"><dc-import name="Me" mode="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Pro}}" hint-placeholder-val="{{false}}"><dc-import name="Pro" mode="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
        <sc-if value="{{s.Auth}}" hint-placeholder-val="{{false}}"><dc-import name="Auth" mode="{{s.p}}" hint-size="390px,844px"></dc-import></sc-if>
      </div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1800,"height":1030}}'>
class Component extends DCLogic {
  renderVals() {
    const C = ['Notifications', 'Me', 'Pro', 'Auth'];
    const I = (c, p, h, t, d) => { const o = { p, t, d, frame: 'width: 390px; height: ' + h + 'px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(6,36,27,0.55)' }; C.forEach((k) => { o[k] = k === c; }); return o; };
    return { items: [
      I('Pro', 'confirm', 844, 'Purchase', 'Store handles payment; KAI never sees card details.'),
      I('Pro', 'success', 844, 'Welcome to Pro', 'Clear what unlocked and when the trial ends.'),
      I('Pro', 'manage', 844, 'Manage subscription', 'Status, renewal, change plan; honest about cancelling.'),
      I('Pro', 'restore', 844, 'Restore purchase', 'One tap on a new phone.')
    ] };
  }
}
</script>
</body>
</html>
