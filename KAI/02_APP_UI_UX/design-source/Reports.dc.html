<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — Reports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#0B3D2E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 1000px; overflow: hidden; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 6px"><a href="Insights.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="back" size="22" hint-size="22px,22px"></dc-import></a><h1 style="flex: 1; margin: 0; font-family: Nunito, sans-serif; font-weight: 800; font-size: 26px">Reports</h1><a href="Analytics-Flow.dc.html" aria-label="Export" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="download" size="20" hint-size="20px,20px"></dc-import></a></div>
    <div style="display: flex; gap: 8px; margin-right: -20px; overflow: hidden"><sc-for list="{{types}}" as="t" hint-placeholder-count="8"><span style="{{t.s}}">{{t.t}}</span></sc-for></div>
    <div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-radius: 16px; padding: 10px 14px"><button type="button" aria-label="Previous month" style="border: none; background: transparent; display: flex"><dc-import name="Icon" icon="back" size="18" hint-size="18px,18px"></dc-import></button><b style="font-size: 15px">September 2026</b><button type="button" aria-label="Next month" style="border: none; background: transparent; display: flex"><dc-import name="Icon" icon="chevron" size="18" hint-size="18px,18px"></dc-import></button></div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 14px; box-shadow: 0 12px 26px -22px rgba(6,36,27,0.45)">
      <div style="position: relative; width: 150px; height: 150px; flex-shrink: 0">
        <svg viewBox="0 0 120 120" width="150" height="150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><circle cx="60" cy="60" r="46" fill="none" stroke="{{a0.c}}" stroke-width="16" stroke-dasharray="{{a0.da}}" stroke-dashoffset="{{a0.off}}" transform="rotate(-90 60 60)"></circle><circle cx="60" cy="60" r="46" fill="none" stroke="{{a1.c}}" stroke-width="16" stroke-dasharray="{{a1.da}}" stroke-dashoffset="{{a1.off}}" transform="rotate(-90 60 60)"></circle><circle cx="60" cy="60" r="46" fill="none" stroke="{{a2.c}}" stroke-width="16" stroke-dasharray="{{a2.da}}" stroke-dashoffset="{{a2.off}}" transform="rotate(-90 60 60)"></circle><circle cx="60" cy="60" r="46" fill="none" stroke="{{a3.c}}" stroke-width="16" stroke-dasharray="{{a3.da}}" stroke-dashoffset="{{a3.off}}" transform="rotate(-90 60 60)"></circle><circle cx="60" cy="60" r="46" fill="none" stroke="{{a4.c}}" stroke-width="16" stroke-dasharray="{{a4.da}}" stroke-dashoffset="{{a4.off}}" transform="rotate(-90 60 60)"></circle><circle cx="60" cy="60" r="46" fill="none" stroke="{{a5.c}}" stroke-width="16" stroke-dasharray="{{a5.da}}" stroke-dashoffset="{{a5.off}}" transform="rotate(-90 60 60)"></circle><circle cx="60" cy="60" r="46" fill="none" stroke="{{a6.c}}" stroke-width="16" stroke-dasharray="{{a6.da}}" stroke-dashoffset="{{a6.off}}" transform="rotate(-90 60 60)"></circle></svg>
        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; color: #5F6E67">Spent</span><b style="font-size: 18px; font-variant-numeric: tabular-nums">₹96,600</b></div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="7"><span style="display: flex; align-items: center; gap: 6px"><span style="{{c.dot}}"></span><span style="flex: 1">{{c.t}}</span><b>{{c.p}}</b></span></sc-for></div>
    </div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 4px 16px; box-shadow: 0 12px 26px -22px rgba(6,36,27,0.45)"><sc-for list="{{cats}}" as="c" hint-placeholder-count="7"><div style="display: flex; justify-content: space-between; padding: 11px 0; border-bottom: 1px solid #F2EFE8; font-size: 14px"><span>{{c.t}}</span><span style="display: flex; gap: 10px; font-variant-numeric: tabular-nums"><span style="{{c.dS}}">{{c.delta}}</span><b>{{c.v}}</b></span></div></sc-for></div>
    <span style="font-size: 12px; color: #5F6E67">Change vs August. Transfers and card bill payments are excluded.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const C = [['Food & Dining', 22500, '#F7A47F', '+8%'], ['Rent', 18000, '#0B3D2E', '0%'], ['EMIs & loan', 16950, '#E0A030', '0%'], ['Shopping', 14800, '#B9A4F5', '−21%'], ['Transport & fuel', 8900, '#3ED1A0', '+4%'], ['Bills & utilities', 8100, '#94B3A1', '−3%'], ['Other', 7350, '#D9D2C3', '−9%']];
    const total = 96600, circ = 2 * Math.PI * 46;
    let acc = 0;
    const arcs = C.map(([t, v, c]) => { const len = v / total * circ; const a = { c, da: (len - 1.5).toFixed(1) + ' ' + circ.toFixed(1), off: (-acc).toFixed(1) }; acc += len; return a; });
    const pill = (on) => 'flex-shrink: 0; padding: 8px 13px; border-radius: 999px; font-size: 13px; font-weight: 700; ' + (on ? 'background: #0B3D2E; color: #FFF8F1;' : 'background: #FFFFFF; border: 1px solid #E6E1D6;');
    return {
      types: ['Spending', 'Income', 'Savings', 'Investments', 'Net worth', 'Accounts', 'Cards', 'Debt', 'Goals'].map((t, i) => ({ t, s: pill(i === 0) })),
      a0: arcs[0], a1: arcs[1], a2: arcs[2], a3: arcs[3], a4: arcs[4], a5: arcs[5], a6: arcs[6],
      cats: C.map(([t, v, c, d]) => ({ t, v: '₹' + v.toLocaleString('en-IN'), p: Math.round(v / total * 100) + '%', delta: d, dS: 'font-size: 12px; font-weight: 700; color: ' + (d.charAt(0) === '+' ? '#A8361F' : d.charAt(0) === '−' ? '#126B4B' : '#94A39C') + ';', dot: 'width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; background: ' + c + ';' }))
    };
  }
}
</script>
</body>
</html>
