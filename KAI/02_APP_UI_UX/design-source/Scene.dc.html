<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI App — 3D scene component</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{root}}">
  <svg viewBox="0 0 300 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position: absolute; inset: 0">
    <defs>
      <filter id="{{fb}}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"></feGaussianBlur></filter>
      <radialGradient id="{{gCush}}" cx="0.4" cy="0.3" r="0.8"><stop offset="0" stop-color="#F3EEFF"></stop><stop offset="1" stop-color="#BBA8F5"></stop></radialGradient>
    </defs>
    <g display="{{rings}}" fill="none" stroke="#3ED1A0">
      <circle cx="{{cx}}" cy="128" r="92" stroke-opacity="0.35" stroke-width="2"></circle>
      <circle cx="{{cx}}" cy="128" r="112" stroke-opacity="0.18" stroke-width="2"></circle>
      <circle cx="{{cx}}" cy="128" r="80" stroke-opacity="0.12" stroke-width="18" filter="url(#{{fb}})"></circle>
    </g>
    <g display="{{cushion}}">
      <ellipse cx="96" cy="214" rx="78" ry="12" fill="#0B2A20" opacity="0.14" filter="url(#{{fb}})"></ellipse>
      <path d="M22 196 Q22 176 50 174 L142 174 Q170 176 170 196 Q170 214 142 214 L50 214 Q22 214 22 196 Z" fill="url(#{{gCush}})"></path>
      <path d="M40 182 Q96 172 152 182" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.5"></path>
    </g>
  </svg>
  <div style="{{mBox}}"><dc-import name="Mascot" expr="{{expr}}" glow="{{glow}}" shadow="{{mShadow}}" hint-size="100%,100%"></dc-import></div>
  <svg viewBox="0 0 300 240" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
    <defs>
      <filter id="{{fb2}}" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"></feGaussianBlur></filter>
      <linearGradient id="{{gForest}}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#227A5C"></stop><stop offset="0.55" stop-color="#0B3D2E"></stop><stop offset="1" stop-color="#072C20"></stop></linearGradient>
      <linearGradient id="{{gMint}}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8CF0CB"></stop><stop offset="0.5" stop-color="#3ED1A0"></stop><stop offset="1" stop-color="#1E9E6E"></stop></linearGradient>
      <radialGradient id="{{gPeach}}" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFEBD9"></stop><stop offset="0.6" stop-color="#F8B48A"></stop><stop offset="1" stop-color="#D9895A"></stop></radialGradient>
      <linearGradient id="{{gGlass}}" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.75"></stop><stop offset="0.35" stop-color="#E8F6EF" stop-opacity="0.35"></stop><stop offset="1" stop-color="#CBEBDA" stop-opacity="0.6"></stop></linearGradient>
      <linearGradient id="{{gCream}}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#EDE6D8"></stop></linearGradient>
      <radialGradient id="{{gLav}}" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"></stop><stop offset="1" stop-color="#B9A4F5"></stop></radialGradient>
    </defs>

    <g display="{{wallet}}">
      <ellipse cx="236" cy="214" rx="48" ry="7" fill="#0B2A20" opacity="0.22" filter="url(#{{fb2}})"></ellipse>
      <rect x="190" y="138" width="94" height="72" rx="18" fill="url(#{{gForest}})"></rect>
      <path d="M196 140 Q236 120 278 140" fill="none" stroke="#3ED1A0" stroke-width="3" opacity="{{walletFull}}"></path>
      <rect x="196" y="128" width="58" height="22" rx="6" fill="#D8F3E5" opacity="{{walletFull}}" transform="rotate(-8 225 139)"></rect>
      <rect x="240" y="160" width="48" height="30" rx="12" fill="#145C45"></rect>
      <circle cx="260" cy="175" r="7" fill="url(#{{gMint}})"></circle>
      <rect x="196" y="144" width="80" height="4" rx="2" fill="#FFFFFF" opacity="0.18"></rect>
    </g>
    <g display="{{jar}}">
      <ellipse cx="236" cy="214" rx="44" ry="7" fill="#0B2A20" opacity="0.2" filter="url(#{{fb2}})"></ellipse>
      <path d="M241 196 V162" stroke="#22A06B" stroke-width="4" stroke-linecap="round"></path>
      <path d="M241 172 C228 168 220 156 222 146 C234 148 242 158 241 172 Z" fill="url(#{{gMint}})"></path>
      <path d="M241 164 C252 156 262 154 268 146 C266 162 254 168 241 164 Z" fill="url(#{{gMint}})"></path>
      <path d="M210 196 Q212 186 236 186 Q260 186 262 196 Z" fill="#CDBB9E"></path>
      <rect x="198" y="120" width="80" height="92" rx="24" fill="url(#{{gGlass}})" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"></rect>
      <rect x="206" y="108" width="64" height="16" rx="7" fill="url(#{{gForest}})"></rect>
      <rect x="207" y="132" width="7" height="58" rx="3.5" fill="#FFFFFF" opacity="0.7"></rect>
    </g>
    <g display="{{growth}}">
      <ellipse cx="236" cy="214" rx="52" ry="7" fill="#0B2A20" opacity="0.2" filter="url(#{{fb2}})"></ellipse>
      <rect x="190" y="172" width="26" height="40" rx="11" fill="url(#{{gMint}})"></rect>
      <rect x="222" y="146" width="26" height="66" rx="11" fill="url(#{{gMint}})"></rect>
      <rect x="254" y="116" width="26" height="96" rx="11" fill="url(#{{gForest}})"></rect>
      <rect x="195" y="177" width="5" height="26" rx="2.5" fill="#FFFFFF" opacity="0.6"></rect>
      <rect x="227" y="151" width="5" height="50" rx="2.5" fill="#FFFFFF" opacity="0.6"></rect>
      <path d="M267 116 V100" stroke="#22A06B" stroke-width="3" stroke-linecap="round"></path>
      <path d="M267 104 C276 98 284 98 290 92 C287 104 277 108 267 104 Z" fill="url(#{{gMint}})"></path>
    </g>
    <g display="{{flag}}">
      <ellipse cx="240" cy="210" rx="56" ry="14" fill="#D8F3E5"></ellipse>
      <ellipse cx="240" cy="206" rx="46" ry="9" fill="#ECFAF3"></ellipse>
      <path d="M244 206 V118" stroke="#0B3D2E" stroke-width="5" stroke-linecap="round"></path>
      <path d="M247 120 L286 132 L247 146 Z" fill="url(#{{gMint}})"></path>
      <circle cx="244" cy="116" r="6" fill="url(#{{gPeach}})"></circle>
    </g>
    <g display="{{folders}}">
      <ellipse cx="236" cy="214" rx="52" ry="7" fill="#0B2A20" opacity="0.2" filter="url(#{{fb2}})"></ellipse>
      <path d="M188 150 Q188 140 198 140 L220 140 L228 148 L276 148 Q286 148 286 158 L286 196 Q286 206 276 206 L198 206 Q188 206 188 196 Z" fill="#E9E3FF" transform="rotate(-6 236 172)"></path>
      <path d="M190 160 Q190 150 200 150 L222 150 L230 158 L278 158 Q288 158 288 168 L288 202 Q288 212 278 212 L200 212 Q190 212 190 202 Z" fill="#FFD9C6"></path>
      <rect x="204" y="148" width="62" height="30" rx="6" fill="url(#{{gCream}})" opacity="{{docsFull}}"></rect>
      <path d="M188 172 Q188 166 196 166 L282 166 Q290 166 290 174 L288 204 Q288 214 278 214 L200 214 Q190 214 190 204 Z" fill="url(#{{gMint}})"></path>
      <rect x="232" y="182" width="26" height="6" rx="3" fill="#FFFFFF" opacity="0.7"></rect>
    </g>
    <g display="{{vault}}">
      <ellipse cx="238" cy="214" rx="50" ry="7" fill="#0B2A20" opacity="0.24" filter="url(#{{fb2}})"></ellipse>
      <rect x="192" y="122" width="92" height="90" rx="22" fill="url(#{{gForest}})"></rect>
      <rect x="198" y="128" width="80" height="6" rx="3" fill="#FFFFFF" opacity="0.18"></rect>
      <circle cx="238" cy="168" r="24" fill="#145C45" stroke="#3ED1A0" stroke-width="3"></circle>
      <circle cx="238" cy="168" r="9" fill="url(#{{gMint}})"></circle>
      <path d="M238 146 V152 M238 184 V190 M216 168 H222 M254 168 H260" stroke="#3ED1A0" stroke-width="3" stroke-linecap="round"></path>
      <path d="M268 112 l14 6 v10 c0 9 -6 15 -14 18 c-8 -3 -14 -9 -14 -18 v-10 z" fill="url(#{{gMint}})"></path>
      <path d="M262 126 l4 4 l8 -8" stroke="#0B3D2E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
    <g display="{{card}}">
      <ellipse cx="238" cy="214" rx="50" ry="7" fill="#0B2A20" opacity="0.2" filter="url(#{{fb2}})"></ellipse>
      <g transform="rotate(-14 238 170)">
        <rect x="188" y="138" width="104" height="66" rx="12" fill="#C7B6FF"></rect>
        <rect x="184" y="146" width="104" height="66" rx="12" fill="url(#{{gForest}})"></rect>
        <rect x="196" y="164" width="18" height="14" rx="3" fill="url(#{{gPeach}})"></rect>
        <rect x="196" y="190" width="46" height="5" rx="2.5" fill="#94B3A1"></rect>
        <circle cx="270" cy="196" r="7" fill="#3ED1A0" opacity="0.9"></circle>
      </g>
    </g>
    <g display="{{calendar}}">
      <ellipse cx="238" cy="214" rx="46" ry="7" fill="#0B2A20" opacity="0.2" filter="url(#{{fb2}})"></ellipse>
      <rect x="196" y="126" width="86" height="86" rx="18" fill="url(#{{gCream}})" stroke="#E6DFD0" stroke-width="1.5"></rect>
      <path d="M196 144 Q196 126 214 126 L264 126 Q282 126 282 144 L282 150 L196 150 Z" fill="url(#{{gForest}})"></path>
      <rect x="214" y="118" width="7" height="18" rx="3.5" fill="#0B3D2E"></rect>
      <rect x="258" y="118" width="7" height="18" rx="3.5" fill="#0B3D2E"></rect>
      <circle cx="239" cy="181" r="17" fill="url(#{{gMint}})"></circle>
      <path d="M231 181 l6 6 l10 -11" stroke="#FFFFFF" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
    <g display="{{trophy}}">
      <path d="M216 214 L224 156 L238 156 L230 214 Z" fill="#3ED1A0" opacity="0.9"></path>
      <path d="M262 214 L254 156 L240 156 L248 214 Z" fill="#22A06B"></path>
      <circle cx="239" cy="140" r="34" fill="url(#{{gPeach}})"></circle>
      <circle cx="239" cy="140" r="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2.5"></circle>
      <path d="M239 124 l4.5 9.5 10.5 1 -8 7 2.4 10.5 -9.4 -5.5 -9.4 5.5 2.4 -10.5 -8 -7 10.5 -1 z" fill="#FFFFFF" opacity="0.95"></path>
    </g>
    <g display="{{check}}">
      <ellipse cx="240" cy="212" rx="34" ry="6" fill="#0B2A20" opacity="0.2" filter="url(#{{fb2}})"></ellipse>
      <circle cx="240" cy="164" r="36" fill="url(#{{gMint}})"></circle>
      <circle cx="228" cy="150" r="10" fill="#FFFFFF" opacity="0.35"></circle>
      <path d="M223 165 l12 12 l22 -24" stroke="#FFFFFF" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
    <g display="{{sparkles}}">
      <path d="M244 60 Q247 78 264 82 Q247 86 244 104 Q241 86 224 82 Q241 78 244 60 Z" fill="url(#{{gLav}})"></path>
      <path d="M276 108 Q278 118 288 120 Q278 122 276 132 Q274 122 264 120 Q274 118 276 108 Z" fill="#3ED1A0"></path>
      <path d="M214 40 Q215 46 221 47 Q215 48 214 54 Q213 48 207 47 Q213 46 214 40 Z" fill="url(#{{gPeach}})"></path>
    </g>
    <g display="{{chat}}">
      <path d="M200 70 Q200 54 216 54 L272 54 Q288 54 288 70 L288 104 Q288 120 272 120 L232 120 L214 136 L216 120 Q200 120 200 104 Z" fill="url(#{{gCream}})" stroke="#E6DFD0" stroke-width="1.5"></path>
      <circle cx="224" cy="88" r="5" fill="#3ED1A0"></circle>
      <circle cx="244" cy="88" r="5" fill="#22A06B"></circle>
      <circle cx="264" cy="88" r="5" fill="#0B3D2E"></circle>
    </g>
    <g display="{{cloud}}">
      <path d="M212 104 Q212 84 232 84 Q240 68 258 72 Q276 72 278 90 Q292 92 290 106 Q288 118 274 118 L224 118 Q212 118 212 104 Z" fill="url(#{{gCream}})" stroke="#E2E4DE" stroke-width="1.5"></path>
      <path d="M244 124 l-6 12 h10 l-6 12" stroke="#F4A57F" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
    <g display="{{moon}}">
      <path d="M262 52 A22 22 0 1 0 284 82 A17 17 0 1 1 262 52 Z" fill="url(#{{gLav}})"></path>
      <circle cx="228" cy="62" r="2.5" fill="#C7B6FF"></circle>
      <circle cx="246" cy="34" r="2" fill="#C7B6FF"></circle>
    </g>
    <g display="{{orbs}}">
      <circle cx="40" cy="60" r="14" fill="url(#{{gLav}})"></circle>
      <circle cx="262" cy="54" r="10" fill="url(#{{gPeach}})"></circle>
      <circle cx="270" cy="170" r="18" fill="url(#{{gMint}})"></circle>
      <ellipse cx="270" cy="208" rx="16" ry="4" fill="#0B2A20" opacity="0.14" filter="url(#{{fb2}})"></ellipse>
    </g>
    <g display="{{dots}}">
      <circle cx="{{d1}}" cy="40" r="5" fill="#3ED1A0"></circle>
      <circle cx="{{d2}}" cy="40" r="5" fill="#22A06B" opacity="0.7"></circle>
      <circle cx="{{d3}}" cy="40" r="5" fill="#0B3D2E" opacity="0.4"></circle>
    </g>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scene":{"editor":"enum","options":["welcome","home","emptyWallet","savings","investing","goals","organizing","emptyDocs","protecting","cards","bills","relaxing","thinking","processing","listening","celebrating","success","concerned","encouraging","ask","recap","debt"],"default":"home"},"w":{"editor":"int","default":300},"h":{"editor":"int","default":240},"dark":{"editor":"boolean","default":false},"$preview":{"width":300,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    if (!this._id) this._id = 's' + Math.random().toString(36).slice(2, 8);
    const id = this._id;
    const S = {
      welcome: ['waving', 'center', ['orbs']],
      home: ['default', 'left', ['wallet']],
      emptyWallet: ['default', 'left', ['wallet']],
      savings: ['happy', 'left', ['jar']],
      investing: ['insight', 'left', ['growth']],
      goals: ['waving', 'left', ['flag']],
      organizing: ['default', 'left', ['folders']],
      emptyDocs: ['thinking', 'left', ['folders']],
      protecting: ['default', 'left', ['vault']],
      cards: ['default', 'left', ['card']],
      bills: ['reminder', 'left', ['calendar']],
      debt: ['happy', 'left', ['calendar']],
      relaxing: ['sleeping', 'center', ['cushion', 'moon']],
      thinking: ['thinking', 'center', ['sparkles']],
      processing: ['thinking', 'center', ['dots']],
      listening: ['listening', 'center', ['rings']],
      celebrating: ['celebrating', 'left', ['trophy']],
      success: ['happy', 'left', ['check']],
      concerned: ['concerned', 'left', ['cloud']],
      encouraging: ['waving', 'left', ['sparkles']],
      ask: ['insight', 'left', ['chat']],
      recap: ['happy', 'left', ['calendar', 'sparkles']]
    };
    const k = this.props.scene ?? 'home';
    const [expr, layout, props] = S[k] || S.home;
    const on = (n) => (props.indexOf(n) !== -1 ? 'inline' : 'none');
    const w = this.props.w ?? 300, h = this.props.h ?? 240;
    const center = layout === 'center';
    const out = {
      root: 'position: relative; width: ' + w + 'px; height: ' + h + 'px; flex-shrink: 0',
      mBox: 'position: absolute; top: ' + (props.indexOf('cushion') !== -1 ? '-2%' : '9%') + '; height: 80%; aspect-ratio: 1; ' + (center ? 'left: 50%; transform: translateX(-50%);' : 'left: 4%;'),
      expr, glow: !!this.props.dark, mShadow: props.indexOf('cushion') === -1,
      cx: 150, d1: 128, d2: 150, d3: 172,
      walletFull: k === 'emptyWallet' ? 0 : 1, docsFull: k === 'emptyDocs' ? 0 : 1,
      fb: id + 'a', fb2: id + 'b', gCush: id + 'c', gForest: id + 'f', gMint: id + 'm', gPeach: id + 'p', gGlass: id + 'g', gCream: id + 'k', gLav: id + 'l'
    };
    ['rings', 'cushion', 'wallet', 'jar', 'growth', 'flag', 'folders', 'vault', 'card', 'calendar', 'trophy', 'check', 'sparkles', 'chat', 'cloud', 'moon', 'orbs', 'dots'].forEach((n) => { out[n] = on(n); });
    return out;
  }
}
</script>
</body>
</html>
