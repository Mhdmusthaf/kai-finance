<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — Global search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#0B3D2E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 10px">
      <label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 52px; border-radius: 16px; padding: 0 14px; background: #FFFFFF; border: 2px solid #17805A"><dc-import name="Icon" icon="search" size="20" color="#17805A" hint-size="20px,20px"></dc-import><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search everything</span><input type="search" value="{{q}}" placeholder="Search everything" style="border: none; outline: none; background: transparent; font-family: inherit; font-size: 16px; font-weight: 700; color: #0B3D2E; flex: 1; min-width: 0"></label>
      <a href="Home.dc.html" style="font-size: 15px; font-weight: 700; color: #17805A">Cancel</a>
    </div>
    <sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-size: 12.5px; font-weight: 800; color: #5F6E67; letter-spacing: 0.06em; text-transform: uppercase">Try asking</span>
        <sc-for list="{{tries}}" as="t" hint-placeholder-count="4"><span style="display: flex; align-items: center; gap: 10px; background: #FFFFFF; border-radius: 14px; padding: 12px 14px; font-size: 14.5px; font-weight: 600"><dc-import name="Icon" icon="sparkle" size="16" color="#5B40C9" hint-size="16px,16px"></dc-import>{{t}}</span></sc-for>
        <span style="font-size: 12.5px; font-weight: 800; color: #5F6E67; letter-spacing: 0.06em; text-transform: uppercase; margin-top: 8px">Recent</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{recent}}" as="r" hint-placeholder-count="4"><span style="padding: 8px 12px; border-radius: 999px; background: #F2F4F3; font-size: 13.5px; font-weight: 600">{{r}}</span></sc-for></div>
      </div>
    </sc-if>
    <sc-if value="{{results}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
          <span style="font-size: 12.5px; font-weight: 800; color: #5F6E67; letter-spacing: 0.06em; text-transform: uppercase; padding-top: 10px">{{g.t}}</span>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
            <a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; padding: 8px 0"><span style="width: 40px; height: 40px; border-radius: 13px; background: #D8F3E5; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="{{r.i}}" size="18" color="#17805A" hint-size="18px,18px"></dc-import></span><span style="flex: 1; display: flex; flex-direction: column"><b style="font-size: 14.5px">{{r.t}}</b><span style="font-size: 12px; color: #5F6E67">{{r.d}}</span></span><b style="font-size: 14px; font-variant-numeric: tabular-nums">{{r.v}}</b></a>
          </sc-for>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["idle","results"],"default":"results"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'results';
    const r = (t, d, v, i, href) => ({ t, d, v, i, href });
    return {
      q: st === 'results' ? 'HDFC' : '', idle: st === 'idle', results: st === 'results',
      tries: ['How much did I spend on fuel in September?', 'Payments due this week', 'Everything with Rahul', 'Insurance renewals'],
      recent: ['Swiggy', 'Laptop EMI', 'SBI card', 'Goa trip'],
      groups: [
        { t: 'Accounts & cards', rows: [r('HDFC Savings', 'Primary account', '₹82,300', 'bank', 'Accounts-Flow.dc.html'), r('HDFC Credit Card ··7788', 'Due 18 Oct', '₹6,410', 'card', 'Accounts-Flow.dc.html')] },
        { t: 'Insurance', rows: [r('HDFC Ergo Optima Secure', 'Health · ₹10L cover · renews March', '', 'shield', 'Recurring-Flow.dc.html')] },
        { t: 'Upcoming', rows: [r('Laptop EMI · 7 of 12', 'Sat 10 Oct · HDFC card', '₹4,500', 'emi', 'Debt-Flow.dc.html')] },
        { t: 'Transactions · 38', rows: [r('Petrol · HP', 'Sat 3 Oct · HDFC card', '−₹1,200', 'fuel', 'Tx-Detail.dc.html'), r('SBI → HDFC', 'Fri 2 Oct · Transfer', '₹10,000', 'transfer', 'Tx-Detail.dc.html')] },
        { t: 'Documents', rows: [r('HDFC Ergo policy 2026.pdf', 'Insurance · added Mar', '', 'doc', 'Vault.dc.html')] }
      ]
    };
  }
}
</script>
</body>
</html>
