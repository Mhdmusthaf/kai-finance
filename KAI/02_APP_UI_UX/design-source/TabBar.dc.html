<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI App — Tab bar + voice button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: absolute; left: 0; right: 0; bottom: 0; font-family: 'Nunito Sans', sans-serif">
  <sc-if value="{{fab}}" hint-placeholder-val="{{true}}">
    <button type="button" aria-label="Talk to KAI — tap to speak, hold to dictate" style="position: absolute; right: 18px; bottom: 100px; width: 62px; height: 62px; border-radius: 50%; border: none; background: radial-gradient(circle at 35% 28%, #1F7A5A 0%, #0B3D2E 62%, #072C20 100%); box-shadow: inset 0 2px 1px rgba(255,255,255,0.25), 0 0 0 5px rgba(62,209,160,0.18), 0 14px 26px -10px rgba(6,36,27,0.6); display: flex; align-items: center; justify-content: center">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#3ED1A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position: absolute"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z M5.5 11a6.5 6.5 0 0 0 13 0 M12 17.5V21"></path></svg>
      <svg viewBox="0 0 100 100" width="18" height="18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position: absolute; top: -4px; right: 2px"><path fill="#3ED1A0" d="M10 90 C2 50 30 14 92 8 C96 60 60 92 10 90 Z"></path></svg>
    </button>
  </sc-if>
  <nav aria-label="Main" style="{{barStyle}}">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; padding-top: 8px">
        <span style="{{t.pill}}"><svg viewBox="0 0 24 24" width="22" height="22" fill="{{t.fill}}" stroke="{{t.color}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="{{t.d}}"></path></svg></span>
        <span style="{{t.label}}">{{t.n}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","transactions","upcoming","insights","money","none"],"default":"home"},"dark":{"editor":"boolean","default":false},"fab":{"editor":"boolean","default":true},"$preview":{"width":390,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const dark = !!this.props.dark;
    const T = [
      ['home', 'Home', 'M4 11l8-6.5 8 6.5v8a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z', 'Home.dc.html'],
      ['transactions', 'Activity', 'M9 6h11 M9 12h11 M9 18h11 M4.5 6h.01 M4.5 12h.01 M4.5 18h.01', 'Tx-List.dc.html'],
      ['upcoming', 'Upcoming', 'M5.5 5h13A1.5 1.5 0 0 1 20 6.5v12a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18.5v-12A1.5 1.5 0 0 1 5.5 5z M4 9.5h16 M8 3v4 M16 3v4', 'Upcoming.dc.html'],
      ['insights', 'Insights', 'M11 3c.6 4.6 2.4 6.4 7 7-4.6.6-6.4 2.4-7 7-.6-4.6-2.4-6.4-7-7 4.6-.6 6.4-2.4 7-7z', 'Insights.dc.html'],
      ['money', 'My Money', 'M4 7.5A2.5 2.5 0 0 1 6.5 5H17v3 M4 7.5v10A2.5 2.5 0 0 0 6.5 20h12.5a1 1 0 0 0 1-1V9a1 1 0 0 0-1-1H6.5A2.5 2.5 0 0 1 4 7.5z', 'MyMoney.dc.html']
    ];
    const on = dark ? '#3ED1A0' : '#17805A';
    const off = dark ? '#94B3A1' : '#5F6E67';
    return {
      fab: this.props.fab ?? true,
      barStyle: 'display: flex; height: 84px; box-sizing: border-box; padding: 0 6px 30px; border-top: 1px solid ' + (dark ? 'rgba(255,248,241,0.08)' : '#EEEAE1') + '; background: ' + (dark ? 'rgba(6,36,27,0.94)' : 'rgba(255,255,255,0.94)') + ';',
      tabs: T.map(([k, n, d, href]) => ({
        n, d, href,
        color: k === a ? on : off,
        fill: k === a ? (dark ? 'rgba(62,209,160,0.22)' : 'rgba(23,128,90,0.14)') : 'none',
        pill: 'display: flex; align-items: center; justify-content: center; width: 52px; height: 28px; border-radius: 999px; ' + (k === a ? 'background: ' + (dark ? 'rgba(62,209,160,0.14)' : '#D8F3E5') + ';' : ''),
        label: 'font-size: 11px; font-weight: ' + (k === a ? 800 : 600) + '; color: ' + (k === a ? (dark ? '#D8F3E5' : '#0B3D2E') : off) + ';'
      }))
    };
  }
}
</script>
</body>
</html>
