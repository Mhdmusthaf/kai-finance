<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — Transaction detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
a{text-decoration:none;color:#0B3D2E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E">
  <div style="padding: 54px 20px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Tx-List.dc.html" aria-label="Back" style="width: 44px; height: 44px; margin-left: -10px; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="back" size="22" hint-size="22px,22px"></dc-import></a>
      <div style="display: flex; gap: 6px"><a href="Tx-Add-States.dc.html" aria-label="Edit" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="edit" size="20" hint-size="20px,20px"></dc-import></a><a href="Tx-Detail-States.dc.html" aria-label="Delete" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="trash" size="20" color="#A8361F" hint-size="20px,20px"></dc-import></a></div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
      <span style="width: 64px; height: 64px; border-radius: 20px; background: #FFE6DA; display: flex; align-items: center; justify-content: center"><dc-import name="Icon" icon="food" size="30" color="#A8361F" hint-size="30px,30px"></dc-import></span>
      <span style="font-size: 15px; font-weight: 700; color: #5F6E67">Dinner · Truffles</span>
      <span style="font-weight: 800; font-size: 44px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums"><span style="font-size: 28px; color: #94A39C">₹</span>500</span>
      <span style="background: #FFE8E0; color: #A8361F; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 800">Expense</span>
    </div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 4px 16px; box-shadow: 0 12px 26px -22px rgba(6,36,27,0.45)">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F2EFE8">
          <dc-import name="Icon" icon="{{r.i}}" size="18" color="#5F6E67" hint-size="18px,18px"></dc-import>
          <span style="width: 96px; font-size: 13px; color: #5F6E67">{{r.k}}</span>
          <b style="flex: 1; font-size: 14px; text-align: right">{{r.v}}</b>
        </div>
      </sc-for>
    </div>
    <div style="background: #FFFFFF; border-radius: 22px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 12px 26px -22px rgba(6,36,27,0.45)">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #5F6E67"><dc-import name="Icon" icon="mic" size="14" color="#5F6E67" hint-size="14px,14px"></dc-import>Added by voice</span>
      <span style="font-size: 14px; font-style: italic; color: #3D4B45">“Spent 500 rupees for dinner with my SBI credit card.”</span>
      <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #3D4B45; border-top: 1px solid #F2EFE8; padding-top: 10px"><dc-import name="Icon" icon="card" size="16" color="#17805A" hint-size="16px,16px"></dc-import>Part of your <a href="Accounts-Flow.dc.html" style="color: #17805A; font-weight: 800">SBI card October statement</a> — due 7 Oct.</span>
    </div>
  </div>

  <sc-if value="{{del}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; inset: 0; z-index: 10; background: rgba(6,36,27,0.42)"></div>
    <div role="alertdialog" aria-label="Delete transaction" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; background: #FCFBF8; border-radius: 28px 28px 0 0; padding: 10px 20px 34px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px">
      <span style="width: 40px; height: 5px; border-radius: 3px; background: #DCD8CF"></span>
      <dc-import name="Scene" scene="concerned" w="220" h="150" hint-size="220px,150px"></dc-import>
      <b style="font-family: Nunito, sans-serif; font-size: 22px">Delete this ₹500 dinner?</b>
      <span style="font-size: 14px; line-height: 1.5; color: #3D4B45; max-width: 300px">Your SBI card balance and October spending will update. You can undo for a few seconds.</span>
      <div style="display: flex; gap: 10px; align-self: stretch; margin-top: 6px"><a href="Tx-Detail.dc.html" style="flex: 1; height: 52px; border-radius: 999px; border: 1.5px solid #E2DCCF; display: flex; align-items: center; justify-content: center; font-weight: 700">Keep it</a><a href="Tx-List.dc.html" style="flex: 1; height: 52px; border-radius: 999px; background: #A8361F; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">Delete</a></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["default","delete"],"default":"default"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      del: (this.props.state ?? 'default') === 'delete',
      rows: [
        { i: 'pie', k: 'Category', v: 'Food & Dining' },
        { i: 'card', k: 'Paid with', v: 'SBI Credit Card ··4021' },
        { i: 'shop', k: 'Merchant', v: 'Truffles, Koramangala' },
        { i: 'clock', k: 'Happened', v: 'Sun 4 Oct, 8:02 PM' },
        { i: 'edit', k: 'Recorded', v: 'Sun 4 Oct, 8:02 PM' },
        { i: 'flag', k: 'Tags', v: 'dinner · friends' },
        { i: 'doc', k: 'Note', v: 'Riya’s birthday' },
        { i: 'repeat', k: 'Repeats', v: 'No' }
      ]
    };
  }
}
</script>
</body>
</html>
