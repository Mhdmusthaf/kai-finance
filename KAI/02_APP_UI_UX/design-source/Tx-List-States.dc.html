<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Activity — states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 48px; padding: 40px 48px 48px; background: #EEE9DF; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; width: max-content">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="5">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: Nunito, sans-serif; font-size: 20px">{{s.t}}</b><span style="font-size: 13px; color: #5F6E67; max-width: 390px; min-height: 36px">{{s.d}}</span></div>
      <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(6,36,27,0.55)"><dc-import name="Tx-List" state="{{s.k}}" hint-size="390px,844px"></dc-import></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2286,"height":1030}}'>
class Component extends DCLogic {
  renderVals() {
    return { states: [
      { k: 'search', t: 'Natural-language search', d: 'KAI shows how it read the query, so results are trustworthy.' },
      { k: 'filter', t: 'Filters sheet', d: 'Type, date, category, account and amount in one thumb-reach sheet.' },
      { k: 'swipe', t: 'Swipe actions', d: 'Swipe left on any row for Edit and Delete.' },
      { k: 'empty', t: 'Empty', d: 'KAI waits beside an empty wallet — say it or type it.' },
      { k: 'loading', t: 'Loading', d: 'Row skeletons in the exact list rhythm.' }
    ] };
  }
}
</script>
</body>
</html>
