<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KAI — Brand Voice</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1600px; height: 1000px; box-sizing: border-box; padding: 64px 72px; background: #FCFBF8; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; display: grid; grid-template-columns: 520px minmax(0, 1fr); gap: 48px">
  <div style="display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #17805A">18 — Brand Voice</span>
      <h1 style="margin: 0; font-family: Nunito, sans-serif; font-weight: 800; font-size: 52px; line-height: 1.05; letter-spacing: -0.02em">Clear facts. Kind framing. One next step.</h1>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px">
      <sc-for list="{{rules}}" as="r" hint-placeholder-count="5">
        <div style="display: flex; gap: 14px; align-items: flex-start">
          <span style="flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: #D8F3E5; color: #126B4B; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r.i}}</span>
          <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px">{{r.t}}</b><span style="font-size: 14px; line-height: 1.5; color: #5F6E67">{{r.d}}</span></div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="background: #FFE8E0; border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #A8361F">Instead of</span><span style="font-size: 15px; text-decoration: line-through; color: #6B3A30">Your spending is too high.</span></div>
      <div style="background: #D8F3E5; border-radius: 16px; padding: 14px 18px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #126B4B">KAI says</span><span style="font-size: 15px; font-weight: 700">You spent 23% more on dining this month. Want to see what changed?</span></div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 16px">
    <span style="font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #5F6E67">Ten microcopy examples</span>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{copy}}" as="c" hint-placeholder-count="10">
        <div style="background: #FFFFFF; border: 1px solid #ECE7DC; border-radius: 20px; padding: 14px 18px 14px 12px; display: flex; gap: 10px; align-items: center">
          <dc-import name="Mascot" expr="{{c.expr}}" shadow="{{false}}" hint-size="64px,64px" style="width: 64px; height: 64px; flex-shrink: 0"></dc-import>
          <div style="display: flex; flex-direction: column; gap: 3px">
            <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #17805A">{{c.ctx}}</span>
            <span style="font-size: 15px; line-height: 1.45; font-weight: 600">{{c.t}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1600,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rules: [
        { i: '1', t: 'Lead with the fact', d: 'Numbers first, opinions never. “₹2,430 due Friday,” not “Don’t forget!”' },
        { i: '2', t: 'Never judge', d: 'No “too much”, “failed”, “bad”. Describe what happened and what’s possible.' },
        { i: '3', t: 'Offer one next step', d: 'End with a question or a single action. Never a list of chores.' },
        { i: '4', t: 'Short and human', d: 'Under 20 words in UI. Contractions are fine. No jargon unless the user used it first.' },
        { i: '5', t: 'Celebrate quietly', d: 'One exclamation mark maximum, saved for real milestones.' }
      ],
      copy: [
        { expr: 'waving', ctx: 'Onboarding', t: 'Hi, I’m KAI. Tell me about your money in your own words.' },
        { expr: 'listening', ctx: 'Voice input', t: 'I’m listening… try “Spent 500 on dinner.”' },
        { expr: 'happy', ctx: 'Transaction added', t: '₹500 added to Food & Dining. Nice and tidy.' },
        { expr: 'insight', ctx: 'Insight', t: 'You spent 23% more on dining this month. Want to see what changed?' },
        { expr: 'default', ctx: 'Goal progress', t: 'You’re ₹2,500 away from your goal. Let’s finish it.' },
        { expr: 'celebrating', ctx: 'Goal complete', t: 'You reached ₹50,000! Your vacation fund is ready.' },
        { expr: 'reminder', ctx: 'Bill reminder', t: 'Your electricity bill of ₹2,430 is due in 3 days. Pay now or remind me later?' },
        { expr: 'concerned', ctx: 'Error', t: 'That payment didn’t go through. Nothing was deducted — want to try again?' },
        { expr: 'thinking', ctx: 'Loading', t: 'Putting your month together…' },
        { expr: 'sleeping', ctx: 'Empty state', t: 'No transactions yet. Say one out loud and I’ll take it from there.' }
      ]
    };
  }
}
</script>
</body>
</html>
