<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Voice — states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; gap: 48px; padding: 40px 48px 48px; background: #EEE9DF; font-family: 'Nunito Sans', sans-serif; color: #0B3D2E; width: max-content">
  <sc-for list="{{states}}" as="s" hint-placeholder-count="7">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 2px"><b style="font-family: Nunito, sans-serif; font-size: 20px">{{s.t}}</b><span style="font-size: 13px; color: #5F6E67; max-width: 390px; min-height: 36px">{{s.d}}</span></div>
      <div style="width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(6,36,27,0.55)"><dc-import name="VoiceFlow" state="{{s.k}}" hint-size="390px,844px"></dc-import></div>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3210,"height":1030}}'>
class Component extends DCLogic {
  renderVals() {
    return { states: [
      { k: 'listening', t: '2 · Listening', d: 'Live waveform and live words. Release to finish, swipe left to cancel.' },
      { k: 'transcribing', t: '3 · Transcribing', d: 'Waveform settles while the last words land.' },
      { k: 'thinking', t: '4 · Thinking', d: 'Fields fill in as KAI understands them — the user sees progress, not a spinner.' },
      { k: 'result', t: '5 · Result', d: 'One card, every field editable. Auto-saves in 3 s for simple entries.' },
      { k: 'complex', t: '5b · Past date & time', d: '“Happened” (yesterday 9 PM) and “Recorded” (now) are stored as two separate fields.' },
      { k: 'missing', t: '6 · Missing information', d: 'Only asked when it matters. Answer by tap or by voice.' },
      { k: 'error', t: '7 · Not understood', d: 'No blame. Retry, or type and KAI still structures it.' }
    ] };
  }
}
</script>
</body>
</html>
